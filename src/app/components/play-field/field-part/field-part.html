<div class="relative flex items-center justify-center w-32 h-32">
    <div
        [id]="lId()"
        [class]="getClass('L') + ' absolute inset-0 m-auto w-2 rotate-45 rounded-full'"
        (click)="moveEmit('L')"
    ></div>
    <div
        [id]="rId()"
        [class]="getClass('R') + ' absolute inset-0 m-auto w-2 -rotate-45 rounded-full'"
        (click)="moveEmit('R')"
    ></div>
</div>
